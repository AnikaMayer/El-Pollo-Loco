                    <button id="fullscrn-btn">

                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            fill="currentColor"
                            stroke="currentColor"

            <button id="restart-btn" class="restart_btn hide-btn">
                Restart
            </button>
            <canvas id="canvas" width="720" height="480"></canvas>
        </div>
        <div id="startScreen" class="start-wrapper">
            <img
                class="startscreen"
                src="./assets/img/9_intro_outro_screens/start/startscreen_1.png"
                alt="startscreen"
            />
            <div class="nav-wrapper">
                <button id="start-btn">Start</button>
            </div>
        </div>
        <div id="control-page" class="controls hide-page">
            <h2>Controls</h2>
            <table>
                <tr>
                    <td>
                        <button>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                fill="currentColor"
                                class="bi bi-caret-left"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    d="M10 12.796V3.204L4.519 8zm-.659.753-5.48-4.796a1 1 0 0 1 0-1.506l5.48-4.796A1 1 0 0 1 11 3.204v9.592a1 1 0 0 1-1.659.753"
                                />
                            </svg>
                        </button>
                        <p>/</p>
                        <button>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                fill="currentColor"
                                class="bi bi-caret-right"
                                viewBox="0 0 16 16"

                                    d="M6 12.796V3.204L11.481 8zm.659.753 5.48-4.796a1 1 0 0 0 0-1.506L6.66 2.451C6.011 1.885 5 2.345 5 3.204v9.592a1 1 0 0 0 1.659.753"
                                />
                            </svg>
                        </button>
                    </td>
                    <td>Move left/ right</td>
                </tr>
                <tr>
                    <td>
                        <button>SPACE</button>
                    </td>
                    <td>Jump</td>
                </tr>
                <tr>
                    <td>
                        <button>D</button>
                    </td>
                    <td>Throw Bottle</td>
                </tr>
            </table>
            <button id="close-btn-cntrl" class="close-btn">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    stroke="currentColor"
                    class="bi bi-x-circle"

                >
                    <path
                        d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"
                    />
