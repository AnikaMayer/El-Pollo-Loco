<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>El pollo loco</title>

        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="style.css" />
        <script type="module" src="./scripts/game.js"></script>
    </head>
    <body>
        <h1>El pollo loco</h1>
        <div id="startScreen" class="start-wrapper">
            <img
                class="startscreen"
                src="./assets/img/9_intro_outro_screens/start/startscreen_1.png"
                alt="startscreen"
            />
            <div class="button-wrapper">
                <button>Start</button>
                <button id="control-btn">Controls</button>
                <button id="imprint-btn">Imprint</button>
            </div>
        </div>
        <div id="control-page" class="controls hide-page">
            <h2>Controls</h2>
            <table>
                <tr>
                    <td>
                        <button>Left</button>
                        <p>/</p>
                        <button>Right</button>
                    </td>
                    <td>Move left/ right</td>
                </tr>
                <tr>
                    <td>
                        <button>SPACE</button>
                    </td>
                    <td>Jump</td>
                </tr>
                <tr>
                    <td>
                        <button>D</button>
                    </td>
                    <td>Throw Bottle</td>
                </tr>
            </table>
            <button id="home-btn-cntrl" class="home-btn" onclick="">
                Home
            </button>
        </div>
        <div id="imprint-page" class="imprint hide-page">
            <h2>Imprint</h2>
            <button id="home-btn-imprint" class="home-btn" onclick="">
                Home
            </button>
        </div>
        <canvas id="canvas" width="720" height="480"></canvas>
    </body>
</html>
